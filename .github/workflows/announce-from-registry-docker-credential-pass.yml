name: announce-from-registry-docker-credential-pass

# Dispatch only. The nightly push job announces what its own run published;
# this one announces everything the registry already holds, which is a
# catch-up operation an owner asks for — never a schedule.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would change without opening an index pull request
        type: boolean
        default: true

concurrency:
  group: mirror-${{ github.workflow }}-announce-from-registry
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ocx-sh/setup-ocx@de8e3366f812941423985eaccae28663ef192e8b  # v1.3.0
        with:
          version: "0.5.3"
      # ghcr.io authenticates with this run's own GITHUB_TOKEN, which is
      # always present — so the credential probe is constant. The shared
      # OCX_MIRROR_REGISTRY_* org secrets hold ocx.sh credentials and are
      # deliberately not read here.
      - name: Detect registry credentials
        id: creds
        run: echo "have=true" >> "${GITHUB_OUTPUT}"
      # docker login so ocx picks the credential up via its native-credential
      # fallback (`get_docker_auth` in crates/ocx_lib/src/auth.rs).
      - name: Login to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                -u "${{ github.actor }}" \
                --password-stdin
      - name: Announce every registry tag into the index
        if: ${{ steps.creds.outputs.have == 'true' }}
        env:
          # Same secret the push job carries. Absent, the announce fails
          # loudly — unlike the push job this workflow has nothing else to do.
          OCX_ANNOUNCE_TOKEN: ${{ secrets.OCX_ANNOUNCE_TOKEN }}
          # Read through the environment, never interpolated into the script.
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            ocx-mirror package pipeline announce --spec docker-credential-pass/mirror.yml --dry-run
          else
            ocx-mirror package pipeline announce --spec docker-credential-pass/mirror.yml
          fi
