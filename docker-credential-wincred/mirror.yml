extends: ../mirror-base.yml

name: docker-credential-wincred

# Logical index package `docker/docker-credential-wincred` lives at the physical
# path `ghcr.io/ocx-contrib/docker/docker-credential-wincred` — slash segments,
# never hyphen-flattened. The first segment must be this repo's own owner or
# `GITHUB_TOKEN` cannot create the package.
#
# The package segment repeats the `docker-credential-` prefix on purpose: it is
# the name Docker looks up on `PATH` for `credsStore: "wincred"`, so it has to
# survive into `asset_type.name` regardless.
target:
  registry: ghcr.io
  repository: ocx-contrib/docker/docker-credential-wincred

source:
  type: github_release
  owner: docker
  repo: docker-credential-helpers
  # See ../docker-credential-pass/mirror.yml for the full tag survey. Same
  # upstream repository, same release train: plain `vX.Y.Z`, with two
  # `vX.Y.Z-beta.N` prereleases at v0.7.0 (below this mirror's floor). The
  # optional group describes upstream's GRAMMAR so that `skip_prereleases`
  # (mirror-base.yml) stays the single knob that decides release POLICY.
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+(?:-beta\\.\\d+)?)$"

# ─── Linkage (Phase 3.5) — no libc gate applies, but measured anyway ────────
#
# Windows has no libc family in the `os.features` sense, so no platform key here
# carries a `+libc.*` suffix and no container legs exist (`containers:` on
# windows/* is rejected at spec load). Confirmed the artifacts are real native
# PEs per arch rather than one binary served to both keys:
#
#   $ file docker-credential-wincred-v0.9.8.windows-amd64.exe
#   PE32+ executable for MS Windows 6.01 (console), x86-64, 8 sections
#
# Credential storage goes through the Windows Credential Manager API, which is
# part of the OS — so like its osxkeychain sibling, and unlike the two Linux
# helpers, this package requires nothing installed on the host. That is why its
# CATALOG.md has no host-requirement section, and the absence is a measurement
# rather than an oversight.
#
# ─── Asset scope (Phase 2, both directions) ────────────────────────────────
#
# Each regex matches EXACTLY ONE asset at v0.8.0 (the floor), v0.9.0 and v0.9.8
# (newest) — 0 matches is a SILENT skip, so the check ran forward across the
# range. Asset naming is byte-identical across all 12 in-range releases, and
# `windows/arm64` is present in every one of them (no per-platform floor needed,
# unlike bazelbuild's buildifier where arm64 appears only from 8.5.1).
#
# This helper ships WINDOWS ONLY — there is no linux or darwin asset in any
# release. So the two keys below are its complete platform set.
#
# The `\.exe$` anchor is doing real work in BOTH directions: it is the only
# asset suffix in this repository's upstream, so without the anchored `^…$` the
# `.exe` could leak into a non-Windows key in a sibling spec, and here it keeps
# the pattern from matching a hypothetical extensionless build.
#
# Deliberately EXCLUDED (the anchored ^…$ already prevents every one):
#
#   docker-credential-pass-*             a different package in this repo
#   docker-credential-secretservice-*    a different package in this repo
#   docker-credential-osxkeychain-*      a different package in this repo
#   checksums.txt                        digest sidecar —
#                                        `verify.github_asset_digest` reads
#                                        GitHub's own asset digest instead
#
# The `-v.*` middle is load-bearing: the asset name carries the version
# (`…-wincred-v0.9.8.windows-amd64.exe`), so a pattern without it matches
# nothing and silently skips the platform.
assets:
  windows/amd64:
    - "^docker-credential-wincred-v.*\\.windows-amd64\\.exe$"
  windows/arm64:
    - "^docker-credential-wincred-v.*\\.windows-arm64\\.exe$"

asset_type:
  # A raw binary, not an archive. `name` is the RENAME TARGET: the asset arrives
  # as `docker-credential-wincred-v0.9.8.windows-amd64.exe` and the bundle must
  # ship it as `docker-credential-wincred.exe`.
  #
  # The `.exe` is REQUIRED here and is not cosmetic — Windows will not execute a
  # file without an executable extension, so dropping it would publish a bundle
  # whose only content cannot be run. This is the same shape as
  # mirror-direnv's windows override; the difference is that this spec publishes
  # Windows ONLY, so there is no `default:`/`platforms:` split to write — one
  # name covers every platform it declares.
  #
  # `metadata.json` still declares the binary WITHOUT the extension
  # (`docker-credential-wincred`), which is correct and not an inconsistency:
  # `binaries` is the bare interface name, and it is also how Docker resolves
  # the helper — `PATHEXT` supplies the `.exe`.
  type: binary
  name: docker-credential-wincred.exe

# `off`, and it has to be: a single executable at the bundle content root means
# the only honest PATH is a bare `${installPath}`, which `auto`/`verify` reject
# at spec load with exit 65 rather than publish `binaries: []`. `binaries` is
# therefore hand-declared in metadata.json.
bin_scan: off

metadata:
  # Paths resolve against THIS spec's directory, not the repo root.
  default: metadata.json

catalog:
  # `catalog.*` resolves against THIS spec's directory and the default probe
  # looks only there, so the repo-root logo has to be named explicitly.
  logo: ../logo.svg

versions:
  # 0.8.0 is the floor the package request asked for; both platforms this spec
  # declares are present and identically named in all 12 releases from here to
  # v0.9.8, so no per-platform `min_version` is needed.
  min: "0.8.0"
  new_per_run: 5
  # Hash-staggered, NOT hand-picked and never "0 */6 * * *" —
  # sha3_256("docker/docker-credential-wincred") % 360 → slot 156.
  # Regenerate with:
  #   python3 .claude/skills/create-mirror/scripts/poll_stagger.py \
  #     docker/docker-credential-wincred
  poll_interval: "36 2-23/6 * * *"

tests:
  # `script:` paths resolve from the REPOSITORY ROOT, not from this spec's
  # directory — the opposite of `metadata.default` and `catalog.*` above.
  - name: smoke
    script: docker-credential-wincred/tests/smoke.star

annotations:
  # From the Phase 1.5 license gate:
  #   $ gh api repos/docker/docker-credential-helpers/license --jq '.license.spdx_id'
  #   MIT
  org.opencontainers.image.licenses: "MIT"

announce:
  package: docker/docker-credential-wincred
  fork: ocx-contrib/index
